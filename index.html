<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Encodage -->
  <meta charset="UTF-8" />

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO de base -->
  <title>Simple Homepage</title>
  <meta name="description" content="Simple homepage.">
  <meta name="keywords" content="Homepage, html, css">
  <meta name="author" content="Nils">

  <!-- Favicon -->
  <link rel="icon" href="simple-homepage-master/favicon.ico" type="image/x-icon">

  <!-- Préconnexion (optimisation performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="container">
        <header>
            <img src="simple-homepage-master/logo-light.svg" alt="Logo du projet" class="logo">
            <div class="nav-links">
                <a href="#" class="about">About us</a>
                <a href="#" class="product">Product</a>
                <a href="#" class="ressource">Ressource</a>
                <a href="#" class="contact">Contact</a>
            </div>
            <img src="simple-homepage-master/dark-mode-toggle-icon.svg" class="toggle-mode">
        </header>

        <main>
            <section>
                <p class="cool">😎 Simple way to communicate</p>
                <h1 class="title">Actions for Accessibility in Design</h1>
                <p class="description">The fastest way to build and deploy websites with reusable components.</p>
                <div class ="get">
                    <button class="btn-start">GET STARTED</button>
                    <button class="btn-demo">Get live demo</button>
                </div>
                <div class="no-requirements">
                    <div class="requirement">
                        <img class="icon-l" src="simple-homepage-master/Done_ring_round_fill.svg" alt="Icon-l">
                        <span class="text-l">No credit card required</span>
                    </div>
                    <div class="requirement">
                        <img class="icon-r" src="simple-homepage-master/Done_ring_round_fill.svg" alt="Icon-r">
                        <span class="text-r">No software to install</span>
                    </div>
                </div>
            </section>
            <div class="image">
                <img src="simple-homepage-master/hero-image-simple-homepage.png" alt="illustration" class="design">
            </div>
        </main>
    </div>
</body>
</html>
